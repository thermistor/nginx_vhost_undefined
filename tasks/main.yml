---

- name: Disable the dist default vhost
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Install undefined vhost
  ansible.builtin.copy:
    src: default.block
    dest: /etc/nginx/sites-available/default.block
    owner: root
    group: root
    mode: '0644'

- name: Enable the undefined vhost
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/00_default.block
    src: /etc/nginx/sites-available/default.block
    state: link
  notify:
    - Restart nginx
